name: project-health-live-test

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - project-health-mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  gitea:
    image: gitea/gitea:1.26.4
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: sqlite3
      GITEA__repository__DEFAULT_BRANCH: main
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:10000/
      GITEA__service__DISABLE_REGISTRATION: "true"
    ports:
      - "127.0.0.1:10000:3000"
      - "127.0.0.1:222:22"
    volumes:
      - project-health-gitea:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  people-portal-server:
    build:
      context: ../PeoplePortalServer
    restart: unless-stopped
    environment:
      PORT: 3000
      PEOPLEPORTAL_LOCAL_MOCK: "true"
      PEOPLEPORTAL_MONGO_URL: mongodb://mongodb:27017/people_portal_local
      PEOPLEPORTAL_TOKEN_SECRET: local-session-secret-not-for-production
      PEOPLEPORTAL_PROJECT_HEALTH_TOKEN: project-health-local-service-token
      PEOPLEPORTAL_GITEA_ENDPOINT: http://gitea:3000
      PEOPLEPORTAL_GITEA_TOKEN: local-mock-token
      PEOPLEPORTAL_SLACK_BOT_TOKEN: xoxb-local-mock-token
      PEOPLEPORTAL_SLACK_INVITE_URL: http://localhost/mock-slack-invite
      AWS_REGION: us-east-1
      AWS_ORG_ROOT_ID: r-localmock
      AWS_NONPROD_OU_ID: ou-localmock
      AWS_MANAGEMENT_ACCOUNT_ID: "000000000000"
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 5s
      retries: 30

  project-health-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PHI_ENVIRONMENT: local
      PHI_DEV_AUTH: "true"
      PHI_MONGO_URI: mongodb://mongodb:27017
      PHI_MONGO_DATABASE: project_health_live_test
      PHI_GITEA_URL: http://gitea:3000
      PHI_GITEA_ORG: appdev
      PHI_GITEA_TOKEN_FILE: /run/secrets/gitea_api_token
      PHI_PEOPLE_PORTAL_URL: http://people-portal-server:3000
      PHI_PEOPLE_PORTAL_API_TOKEN: project-health-local-service-token
      PHI_AGENT_INGEST_TOKEN: project-health-local-agent-token
      PHI_AGGREGATION_FLOOR: "5"
      PHI_BACKFILL_WEEKS: "10"
      PHI_UPSTREAM_TIMEOUT_SECONDS: "120"
    depends_on:
      mongodb:
        condition: service_healthy
      gitea:
        condition: service_healthy
      people-portal-server:
        condition: service_healthy
    secrets:
      - gitea_api_token
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  project-health-dashboard:
    image: python:3.12-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-m", "http.server", "4173", "--bind", "0.0.0.0"]
    volumes:
      - ./:/app:ro
    depends_on:
      project-health-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4173:4173"

volumes:
  project-health-mongodb:
  project-health-gitea:

secrets:
  gitea_api_token:
    file: ./.live-test-token
