<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#063e92" />
    <title>App Dev Horizon</title>
    <link rel="icon" href="assets/adc-256.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Points the deployed Vercel frontend at the Render-hosted API.
      // Update this if the Render service is renamed or moves to a custom domain.
      window.PHI_API_BASE = 'https://app-dev-horizon-api.onrender.com';
    </script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand-lockup">
          <img class="brand-mark" src="assets/adc-256.png" width="34" height="34" alt="App Dev Club" />
          <div>
            <div class="brand-name">App Dev Horizon</div>
            <div class="brand-caption">INTELLIGENCE</div>
          </div>
        </div>

        <nav class="primary-nav">
          <button class="nav-item active" data-view="overview"><span class="nav-icon" data-icon="grid"></span><span>Overview</span><span class="nav-count">—</span></button>
          <button class="nav-item" data-view="projects"><span class="nav-icon" data-icon="folder"></span><span>Projects</span></button>
          <button class="nav-item" data-view="insights"><span class="nav-icon" data-icon="trend"></span><span>Insights</span></button>
        </nav>

        <div class="sidebar-footer">
          <div class="user-avatar">JK</div>
          <div class="user-copy"><strong>Jordan Kim</strong><span>Portfolio lead</span></div>
          <button class="icon-button subtle" aria-label="Account menu">•••</button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumbs"><span>App Dev Horizon</span><span class="breadcrumb-slash">/</span><strong id="breadcrumb-current">Overview</strong></div>
          <div class="topbar-actions">
            <button class="avatar-button" aria-label="Open profile">JK</button>
          </div>
        </header>

        <div id="app-view" class="view-container"></div>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-check" data-icon="check"></span><span id="toast-message">Feedback recorded</span></div>
    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <section class="feedback-modal" role="dialog" aria-modal="true" aria-labelledby="feedback-title">
        <button class="modal-close" id="modal-close" aria-label="Close feedback dialog">×</button>
        <div class="modal-icon" data-icon="message"></div>
        <span class="eyebrow">Project context</span>
        <h2 id="feedback-title">Add context to this warning</h2>
        <p id="feedback-project-name">Tell the team what leadership should know about this project.</p>
        <div class="feedback-options" id="feedback-options">
          <button data-feedback="risk_confirmed"><span data-icon="check-circle"></span>Risk confirmed</button>
          <button data-feedback="expected_cycle"><span data-icon="calendar"></span>Expected cycle</button>
          <button data-feedback="data_quality"><span data-icon="triangle"></span>Data quality issue</button>
          <button data-feedback="planned_pause"><span data-icon="pause"></span>Planned pause</button>
        </div>
        <label class="modal-label" for="feedback-note">Optional note</label>
        <textarea id="feedback-note" rows="3" placeholder="Add a short explanation for the next review..."></textarea>
        <div class="modal-actions"><button class="secondary-button" id="modal-cancel">Cancel</button><button class="primary-button" id="modal-save">Save review note <span>→</span></button></div>
      </section>
    </div>

    <script src="app.js?v=live-stack-2"></script>
  </body>
</html>
