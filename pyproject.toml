[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "app-dev-horizon"
version = "0.1.0"
description = "Privacy-preserving backend foundation for App Dev Horizon."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "beanie>=1.27,<2.0",
  "motor>=3.6,<4.0",
  # The pull-only ingestion adapters write synchronously and run as batch
  # jobs outside the request loop, so they use a blocking client.
  "pymongo>=4.9,<5.0",
  "Authlib>=1.3,<2.0",
  "httpx>=0.27,<1.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "APScheduler>=3.10,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
