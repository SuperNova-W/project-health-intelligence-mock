# Render Blueprint for the App Dev Horizon backend.
#
# The frontend stays on Vercel and is not part of this blueprint; it calls
# this API's public URL directly (see window.PHI_API_BASE in index.html).
#
# Every service here builds from Dockerfile.render, NOT the repo's top-level
# Dockerfile -- that one hardcodes
# `ENTRYPOINT ["python", "scripts/container_entrypoint.py"]` for
# compose.live-test.yaml, and a Docker ENTRYPOINT always runs regardless of
# a dockerCommand override (CMD args are appended to it, never replace it).
# Dockerfile.render sets no ENTRYPOINT so each service's dockerCommand below
# actually controls what runs.
#
# SQLite lives on a persistent disk attached ONLY to the web service --
# Render disks are single-service, so the cron jobs below never touch it
# directly. Instead they call the web service's own /admin/sync/* endpoints
# over HTTPS, which run the same backend.jobs functions in-process against
# the connection the web service already holds. Set PHI_ADMIN_SYNC_TOKEN
# (below) to a real secret before the first deploy -- those endpoints refuse
# every request until it's configured. The cron commands use a Python
# urllib one-liner rather than curl, since curl isn't installed in the
# python:3.12-slim base image.
services:
  - type: web
    name: app-dev-horizon-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    dockerCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    region: oregon
    healthCheckPath: /health
    disk:
      name: phi-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PHI_ENVIRONMENT
        value: production
      - key: PHI_SQLITE_PATH
        value: /var/data/project_health_intelligence.db
      - key: PHI_AGGREGATION_FLOOR
        value: "5"
      - key: PHI_RULE_SET_VERSION
        value: rules-v1
      - key: PHI_GITEA_URL
        value: https://git.appdevclub.com
      - key: PHI_GITEA_ORG
        sync: false
      - key: PHI_GITEA_API_TOKEN
        sync: false
      - key: PHI_PEOPLE_PORTAL_URL
        sync: false
      - key: PHI_PEOPLE_PORTAL_API_TOKEN
        sync: false
      # Shared secret required in the X-Admin-Sync-Token header by
      # /admin/sync/*. Generate a random value and set it here (and in the
      # three cron jobs below) via the Render dashboard -- do not commit one.
      - key: PHI_ADMIN_SYNC_TOKEN
        sync: false

  # One-off: trigger manually from the Render dashboard ("Trigger Run") once,
  # right after the first deploy, to seed the trailing 8-week baseline. Rules
  # need at least four prior weekly observations before any warning can fire.
  # The schedule below intentionally never fires on its own (Feb 31 doesn't
  # exist) so this only ever runs when triggered by hand.
  - type: cron
    name: app-dev-horizon-backfill
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    dockerCommand: >-
      python -c "import os,urllib.request as u;
      r=u.Request('https://app-dev-horizon-api.onrender.com/admin/sync/backfill?weeks=10',
      method='POST', headers={'X-Admin-Sync-Token': os.environ['PHI_ADMIN_SYNC_TOKEN']});
      print(u.urlopen(r, timeout=1800).read().decode())"
    plan: starter
    region: oregon
    schedule: "0 0 31 2 *"
    envVars:
      - key: PHI_ADMIN_SYNC_TOKEN
        sync: false

  - type: cron
    name: app-dev-horizon-nightly
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    dockerCommand: >-
      python -c "import os,urllib.request as u;
      r=u.Request('https://app-dev-horizon-api.onrender.com/admin/sync/nightly?lookback_days=14',
      method='POST', headers={'X-Admin-Sync-Token': os.environ['PHI_ADMIN_SYNC_TOKEN']});
      print(u.urlopen(r, timeout=600).read().decode())"
    plan: starter
    region: oregon
    schedule: "0 8 * * *" # 08:00 UTC daily
    envVars:
      - key: PHI_ADMIN_SYNC_TOKEN
        sync: false

  - type: cron
    name: app-dev-horizon-weekly
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    dockerCommand: >-
      python -c "import os,urllib.request as u;
      r=u.Request('https://app-dev-horizon-api.onrender.com/admin/sync/weekly',
      method='POST', headers={'X-Admin-Sync-Token': os.environ['PHI_ADMIN_SYNC_TOKEN']});
      print(u.urlopen(r, timeout=600).read().decode())"
    plan: starter
    region: oregon
    schedule: "59 23 * * 0" # Sunday 23:59 UTC -- matches .gitea/workflows/weekly-refresh.yaml
    envVars:
      - key: PHI_ADMIN_SYNC_TOKEN
        sync: false
